name: Probe employer boards

on:
  push:
    branches-ignore: [main]
    paths: ["tools/probe_boards.py", "tools/careers_urls.json", ".github/workflows/probe-boards.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/probe_boards.py
