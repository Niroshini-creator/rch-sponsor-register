name: Refresh Mugilan matched jobs

# Separate from refresh-jobs.yml: its own schedule, concurrency group and output file (mugilan/data/jobs.json).
on:
  schedule:
    - cron: "43 6 * * *"   # daily, 06:43 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Maximum job age in days"
        default: "7"
  push:
    branches: [main]
    paths: ["mugilan/jobmatch/**", "mugilan/config/**", ".github/workflows/refresh-mugilan-jobs.yml"]

permissions:
  contents: write

concurrency:
  group: refresh-mugilan-jobs
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s mugilan/tests -t . -v

  refresh:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build matched feed
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
        run: python -m mugilan.jobmatch --days "${{ github.event.inputs.days || '7' }}"
      - name: Commit updated feed
        run: |
          if git diff --quiet -- mugilan/data/jobs.json; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mugilan/data/jobs.json
          git commit -m "Refresh Mugilan matched jobs"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((attempt * 5))
          done
          exit 1
