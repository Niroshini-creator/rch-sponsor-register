<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Find roles for your CV</title>
  <meta name="description" content="Internal recruiter boards: roles from the last 7 days matched to one candidate's CV, visa and clearance.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header"><div class="wrap" id="header"><h1>Find roles for your CV</h1></div></header>
  <main class="wrap" id="app"><p class="muted">Loading…</p></main>
  <template id="add-tpl">
<form id="form" class="panel" autocomplete="off">
      <h2>1 · Your CV</h2>
      <p class="small muted">Upload your CV (PDF or text). It is read here, in your browser, and is not uploaded or stored anywhere.</p>
      <div id="cvs"></div>
      <button type="button" class="btn" id="add-cv">+ Add a second CV (optional)</button>

      <h2 style="margin-top:18px">2 · About you</h2>
      <div class="bar">
        <label>Name (optional)<input id="name"></label>
        <label>Where you live<input id="location" placeholder="e.g. Coventry"></label>
        <label>Visa<select id="visa"><option value="graduate|Graduate visa (PSW)">Graduate visa (PSW)</option><option value="skilled_worker|Skilled Worker visa">Skilled Worker visa</option><option value="global_business_mobility|Global Business Mobility visa">Global Business Mobility</option><option value="dependant|Dependant / partner visa">Dependant / partner</option><option value="other|Other">Other</option></select></label>
        <label>Visa valid until<input type="month" id="expires"></label>
        <label>Sponsorship<select id="sponsorship"><option value="preferred">I can work now, I want a sponsor</option><option value="required">I need a sponsor to work</option><option value="not_needed">I need no sponsor</option></select></label>
        <label class="check"><input type="checkbox" id="right-opt"> I hold US work authorisation without a sponsor (F-1 OPT or STEM OPT)</label>
        <label class="check"><input type="checkbox" id="right-1g"> I hold Irish Stamp 1G (Graduate scheme) permission</label>
        <label class="check"><input type="checkbox" id="new-entrant"> I am a new entrant (recent graduate / switching from a Graduate visa)</label>
        <label>Security clearance you hold<select id="clearance"><option value="none">None</option><option value="basic">Basic (BPSS)</option><option value="sc">SC</option><option value="dv">DV</option></select></label>
        <label>Experience level<select id="level"><option value="">Work it out from my CV dates</option><option value="junior">Junior (under 2 years)</option><option value="mid">Mid level (about 4 years)</option><option value="senior">Senior (about 8 years)</option><option value="lead">Lead / head (10+ years)</option></select></label>
        <label>Driving licence<select id="licence"><option value="">Not saying</option><option value="yes">Yes</option><option value="no">No</option></select></label>
      </div>
      <fieldset style="margin-top:12px;border:1px solid var(--border);border-radius:8px;padding:8px 12px">
        <legend class="small">Roles you are looking for (optional, add as many as you like)</legend>
        <div class="bar"><label style="flex:1">Job title<input id="role-input" list="role-suggestions" placeholder="e.g. Data Analyst, SAP GRC Consultant, Project Coordinator"></label>
          <button type="button" class="btn" id="role-add">Add role</button></div>
        <datalist id="role-suggestions"></datalist>
        <ul class="chips" id="role-chips"></ul>
        <p class="small muted" style="margin:6px 0 0">We also suggest roles from your CV. The roles you add are searched first. A role only appears if employers advertise it this week.</p>
      </fieldset>
      <fieldset style="margin-top:12px;border:1px solid var(--border);border-radius:8px;padding:8px 12px">
        <legend class="small">Where would you work? Tick all that apply</legend>
        <label class="check"><input type="checkbox" name="region" value="GB" checked> United Kingdom</label>
        <label class="check"><input type="checkbox" name="region" value="IE"> Ireland</label>
        <label class="check"><input type="checkbox" name="region" value="EU"> Europe (EU/EEA, Switzerland)</label>
        <label class="check"><input type="checkbox" name="region" value="US"> United States</label>
        <label class="check"><input type="checkbox" name="region" value="AU"> Australia</label>
        <label class="check"><input type="checkbox" id="region-me" name="region" value="ME"> Middle East (UAE, Saudi Arabia, Qatar, Kuwait, Bahrain, Oman)</label>
        <label class="check"><input type="checkbox" name="region" value="IN"> India (no visa needed)</label>
        <label class="field small" style="display:block;margin:4px 0">Lowest pay for roles in India, lakhs per year (LPA) <input id="india-lpa" type="number" min="0" step="0.5" value="8" style="width:5em"></label>
        <label class="check"><input type="checkbox" id="english-only" checked> Only roles that can be done in English (recommended outside the UK, Ireland and Australia)</label>
        <p class="small muted" style="margin:6px 0 0">Outside the UK and Ireland, roles are shown if the advert offers sponsorship, the employer is on that country's sponsor list, or the country's employers sponsor by default (the Gulf states). Coverage is widest in the UK and thinner elsewhere.</p>
      </fieldset>
      <fieldset style="margin-top:12px;border:1px solid var(--border);border-radius:8px;padding:8px 12px">
        <legend class="small">Attach a document of suitable positions (optional)</legend>
        <p class="small muted" style="margin:0 0 6px">A PDF, Word (.docx) or text file listing the job titles you want. Bullets are titles; other lines are headings, ideally named after your CV (e.g. "Business Analyst CV"). It is read in your browser and not uploaded.</p>
        <div class="bar"><label>Attach document<input type="file" id="roles-file" accept=".pdf,.docx,.txt,.md"></label></div>
        <div id="roles-preview" class="small" style="margin:6px 0"></div>
        <details><summary class="small">or paste or edit the list</summary>
          <label class="field"><textarea id="roles-text" rows="5" style="width:100%;font:inherit" placeholder="Business Analyst CV&#10;• Business Analyst&#10;• Requirements Analyst"></textarea></label>
        </details>
      </fieldset>
      <details style="margin-top:10px"><summary class="small">Optional: notes</summary>
        <div class="bar"><label style="flex:1">Current situation<input id="status" placeholder="e.g. part-time plus freelance"></label><label style="flex:1">Notes<input id="notes"></label></div>
      </details>
      <p><button class="btn primary" type="submit">Find vacancies</button> <span id="msg" class="small muted"></span></p>
    </form>
    <p class="small muted">Vacancies come from the last 7 days across NHS Jobs, universities, schools, employer career sites and job boards. You apply on the employer's own site. <a href="#boards">Recruiter boards</a></p>
  </template>
  <script src="docread.js"></script>
  <script src="intake.js"></script>
  <script src="match.js"></script>
  <script src="careerlinks.js"></script>
  <script src="add.js"></script>
  <script src="app.js"></script>
</body>
</html>
